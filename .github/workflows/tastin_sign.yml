name: 塔斯汀每日签到

on:
  schedule:
    # GitHub Actions 使用 UTC 时间，北京时间 = UTC + 8。
    # 排在北京 06:05（对应 22:05 UTC）——GitHub 定时常延迟数小时，排早些让实际签到尽量落在上午；
    # 用非整点分钟减少排队拥堵。单次运行内指数退避重试（最多 5 次、总时长上限 15 分钟）兜底。
    - cron: "5 22 * * *"    # 北京 06:05
  workflow_dispatch: # 支持手动触发

# 同一时刻只跑一个签到任务：新触发会取消仍在跑的旧任务，避免任务堆叠/长时间占用
concurrency:
  group: tastin-sign
  cancel-in-progress: true

jobs:
  sign:
    runs-on: ubuntu-latest
    # 硬性超时兜底：正常几分钟完成；封顶 20 分钟（重试窗口约 15 分钟 + 装依赖等开销）
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置上海时区
        run: |
          sudo ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo Asia/Shanghai | sudo tee /etc/timezone > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: 执行签到
        env:
          TASTIN_USER_TOKEN: ${{ secrets.TASTIN_USER_TOKEN }}
          TASTIN_MEMBER_PHONE: ${{ secrets.TASTIN_MEMBER_PHONE }}
          TASTIN_SHOP_ID: ${{ secrets.TASTIN_SHOP_ID || '28416' }}
          TASTIN_VERSION: ${{ secrets.TASTIN_VERSION || '3.78.0' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_NOTIFY_SIGN: ${{ secrets.SMTP_NOTIFY_SIGN || '' }}
        run: python tastin_sign.py
