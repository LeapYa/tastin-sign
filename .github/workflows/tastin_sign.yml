name: 塔斯汀每日签到

on:
  schedule:
    # GitHub Actions 使用 UTC 时间，北京时间 = UTC + 8。
    # 每天多个时段各跑一次，任一成功即可；已签到的后续运行会自动识别并跳过。
    # 某个时段免费代理全挂也没关系，稍后的时段会自动重试，尽量避免漏签。
    - cron: "5 1 * * *"    # 北京 09:05
    - cron: "5 4 * * *"    # 北京 12:05
    - cron: "5 7 * * *"    # 北京 15:05
    - cron: "5 10 * * *"   # 北京 18:05
    - cron: "5 13 * * *"   # 北京 21:05
  workflow_dispatch: # 支持手动触发

# 同一时刻只跑一个签到任务：新触发会取消仍在跑的旧任务，避免任务堆叠/长时间占用
concurrency:
  group: tastin-sign
  cancel-in-progress: true

jobs:
  sign:
    runs-on: ubuntu-latest
    # 硬性超时兜底：正常几分钟完成，封顶 20 分钟仅防极端情况下长时间空跑
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置上海时区
        run: |
          sudo ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo Asia/Shanghai | sudo tee /etc/timezone > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: 执行签到
        env:
          TASTIN_USER_TOKEN: ${{ secrets.TASTIN_USER_TOKEN }}
          TASTIN_MEMBER_PHONE: ${{ secrets.TASTIN_MEMBER_PHONE }}
          TASTIN_SHOP_ID: ${{ secrets.TASTIN_SHOP_ID || '28416' }}
          TASTIN_VERSION: ${{ secrets.TASTIN_VERSION || '3.78.0' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_NOTIFY_SIGN: ${{ secrets.SMTP_NOTIFY_SIGN || '' }}
          # 把触发本次运行的 cron 传给脚本；手动触发时为空。
          # 脚本据此只让“首个时段(9:05)”或手动运行标红/发邮件，保证一天最多一封失败邮件。
          TASTIN_CRON: ${{ github.event.schedule }}
        run: python tastin_sign.py
